<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minigames, 3D Web and Storytelling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Be+Vietnam+Pro:wght@400;500&family=Lilita+One&family=Russo+One&display=swap">
<style>
:root{
  --bg:#131217; --ink:#fff; --ink-soft:rgba(255,255,255,.86);
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.45 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{height:100%;min-height:480px;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,1.4vw,18px);padding:clamp(10px,2vw,28px)}

.panel{
  container-type:inline-size;position:relative;isolation:isolate;overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:clamp(16px,2vw,30px);border-radius:6px;color:inherit;text-decoration:none;
  background-color:var(--c3);
  background-image:linear-gradient(to top,rgba(0,0,0,.62),rgba(0,0,0,.04) 72%),var(--panel-image);
  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
  transition:transform .25s ease,filter .25s ease;
}
.panel::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.55),transparent 46%)}
.p1{--c3:#06122b;--panel-image:url("VantaLumen_Landing_Assets/minigames-rover.jpg")}
.p2{--c3:#120831;--panel-image:url("VantaLumen_Landing_Assets/interactive-3d.jpg");background-position:center,center top;background-size:auto,90% auto}
.p3{--c3:#2b0b1d;--panel-image:url("VantaLumen_Landing_Assets/storytelling-rise.jpg");background-position:center,center;background-size:auto,cover}

.t{margin:0;font-weight:400;font-size:calc(var(--fs)*var(--k,1));line-height:.95;text-transform:uppercase;white-space:nowrap;text-shadow:0 4px 20px rgba(0,0,0,.35)}
.p1 .t{--fs:12.5cqw;font-family:"Russo One","Arial Black",Impact,sans-serif;font-style:italic}
.p2 .t{--fs:25cqw;font-family:Anton,Impact,"Arial Narrow",sans-serif;letter-spacing:.01em}
.p3 .t{--fs:11cqw;font-family:"Lilita One","Arial Rounded MT Bold","Arial Black",sans-serif}
.cap{margin:.7em 0 0;max-width:32ch;color:var(--ink-soft)}

.panel:hover,.panel:focus-visible{transform:translateY(-6px);filter:brightness(1.1)}
.panel:focus-visible{outline:3px solid #fff;outline-offset:4px}

@media (max-width:760px){
  html,body{height:auto}
  .wrap{height:auto;min-height:0;grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:min(86vw,340px);grid-auto-rows:minmax(290px,auto);overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory}
  .panel{--k:.8;padding:18px;scroll-snap-align:start}
  .p3{background-position:center,center;background-size:auto,cover}
}
@media (prefers-reduced-motion:reduce){
  .panel{transition:none}
  .panel:hover,.panel:focus-visible{transform:none}
}
</style>
</head>
<body>
<h1 class="sr">Home</h1>
<main class="wrap">

  <a class="panel p1" href="https://echoes-in-the-dust-liard.vercel.app/">
    <h2 class="t">Minigames</h2>
    <p class="cap">Small games you can play in just a few minutes.</p>
  </a>

  <a class="panel p2" href="https://vantalumen-atlas.vercel.app/">
    <h2 class="t">3D web</h2>
    <p class="cap">Explore a 3D world right in your browser.</p>
  </a>

  <a class="panel p3" href="VantaLumen_SVG_Webflow_Package/RISE_Story.html">
    <h2 class="t">Storytelling</h2>
    <p class="cap">Stories told through illustrations.</p>
  </a>

</main>
</body>
</html>
