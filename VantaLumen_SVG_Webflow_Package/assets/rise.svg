<svg xmlns="http://www.w3.org/2000/svg" viewBox="-210 -225 420 420" role="img" aria-labelledby="rise-title rise-desc">
  <title id="rise-title">RISE, the little cosmic storyteller</title>
  <desc id="rise-desc">A round, peach-colored mascot with lavender cheeks, yellow side discs, and a blue globe cap with green continents and a dark band edged in gold. Seven separately named expression groups allow animation.</desc>
